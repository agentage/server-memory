name: Release Train

# Fully automated Friday MINOR release of @agentage/server-memory to npm. No human
# step on the happy path. Weekly cadence, always a minor bump.
#
# Level 1 (dep-driven): this package wraps @agentage/memory-core, whose own L0 train
# runs at 19:00 UTC. This one runs at 20:00 UTC so it can pull the fresh core.
# Before the version bump it upgrades every @agentage/* dependency to latest; a dep
# change ALONE justifies releasing (the whole point of L1). The frozen 6-tool
# contract means `npm run verify` against the bumped memory-core is the integration
# gate - a red verify fails the train without releasing anything.
#
# Single UTC cron, no Prague/DST gate: a late-firing cron just means the train
# departs late, not that it gets skipped.
#
# v2 delivery (2026-08-22): the release commit goes DIRECT TO MASTER. The old
# branch -> PR -> auto-merge -> self-approve -> poll-merged chain broke three
# different ways in three weeks (repo auto-merge setting, the action_required
# approval gate, a guard field bug); none of that machinery exists any more.
# `npm run verify` runs before the push, a rejected push is a red run (never a
# force), and the train only goes green once the dispatched publish run has
# succeeded AND npm actually serves the new version. Red run = the only alarm;
# there are no silent-skip states.
on:
  schedule:
    - cron: '0 20 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  dependabot-quiescence:
    name: 🤖 Wait for dependabot triage to finish
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wait until this repo has no fresh open dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Dependabot merging is owned by the org triage automation; this job only
          # delays the train while that agent may still be working. PRs still open
          # after the wait were deliberately left by triage - never merge them here.
          for i in $(seq 1 45); do
            OPEN=$(gh pr list -R "$REPO" --author "app/dependabot" --state open --json number --jq 'length')
            [ "$OPEN" = "0" ] && { echo "No open dependabot PRs - proceeding."; exit 0; }
            echo "poll $i: $OPEN open dependabot PR(s), waiting for triage..."
            sleep 60
          done
          echo "Dependabot PR(s) still open after wait - releasing without them." | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: 🚝 Cut minor release
    needs: dependabot-quiescence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect releasable commits since the last tag
        id: detect
        run: |
          set -euo pipefail
          LAST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          RANGE=""; [ -n "$LAST_TAG" ] && RANGE="${LAST_TAG}..HEAD"
          echo "Last tag: ${LAST_TAG:-none}"
          SUBJECTS=$(git log $RANGE --no-merges --pretty=%s)
          # Releasable = anything except docs/ci/plain-chore; chore(deps) counts
          # (dependabot bundles ship weekly), chore(release) does not.
          RELEASABLE=$(printf '%s\n' "$SUBJECTS" \
            | grep -vE '^(docs|ci)(\([^)]*\))?!?:' \
            | grep -vE '^chore(\([^)]*\))?!?:' || true)
          DEPS=$(printf '%s\n' "$SUBJECTS" | grep -E '^chore\(deps' || true)
          COUNT=$(printf '%s\n%s\n' "$RELEASABLE" "$DEPS" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "No releasable commits since ${LAST_TAG:-repo start}."
            echo "commits=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found $COUNT releasable commit(s)."
            echo "commits=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump internal @agentage/* dependencies to latest
        id: deps
        run: |
          set -euo pipefail
          # L1: pull the fresh @agentage/* line (memory-core L0 released at 19:00 UTC).
          # --target minor: majors stay a deliberate human/dependabot call, not an auto-bump.
          npx --yes npm-check-updates -u --target minor --dep prod,dev --filter "@agentage/*"
          npm install
          if git diff --quiet -- package.json package-lock.json; then
            echo "No @agentage/* dependency changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Internal @agentage/* dependencies changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to release
        id: decide
        run: |
          # A dep change alone justifies releasing (L1); so do releasable commits.
          if [ "${{ steps.detect.outputs.commits }}" = "true" ] || [ "${{ steps.deps.outputs.changed }}" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Neither releasable commits nor dep changes - no release this week." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump minor version (package.json)
        id: bump
        if: steps.decide.outputs.release == 'true'
        run: |
          set -euo pipefail
          NEW=$(node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const [a, b] = pkg.version.split(".").map(Number);
            const next = `${a}.${b + 1}.0`;
            pkg.version = next;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log(next);
          ')
          npm install --package-lock-only
          echo "New version: $NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      # Verify against the bumped memory-core is the integration gate; a red verify
      # fails the train here, before anything reaches master.
      - name: Verify
        if: steps.bump.outputs.version
        run: npm run verify

      - name: Commit release direct to master
        id: push
        if: steps.bump.outputs.version
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): ${VERSION}"
          # master may have moved while the train ran; rebase on it. A rejected
          # push is a red run - never force.
          git pull --rebase origin master
          git push origin HEAD:master
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch publish workflow
        id: dispatch
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A GITHUB_TOKEN push never fires release.yml's push trigger, so dispatch
          # it explicitly. Its dispatch path re-verifies, skips if the version is
          # already on npm, then publishes to npm + tags the release.
          BEFORE=$(gh run list -R "$REPO" --workflow release.yml --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run release.yml --ref master --repo "$REPO"
          RUN_ID=""
          for i in $(seq 1 24); do
            ID=$(gh run list -R "$REPO" --workflow release.yml --json databaseId --jq '.[0].databaseId // 0')
            [ "$ID" != "$BEFORE" ] && { RUN_ID="$ID"; break; }
            echo "poll $i: dispatched run not visible yet"
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::release.yml dispatch never produced a run"
            echo "Publish dispatch produced no run - ${{ steps.bump.outputs.version }} NOT published." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched publish run https://github.com/$REPO/actions/runs/$RUN_ID"

      - name: Wait for the publish run to finish
        if: steps.dispatch.outputs.run_id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          # Fail-closed: a red publish is a red train, not a green one with a
          # stranded version bump on master.
          CONCL=""
          for i in $(seq 1 120); do
            OUT=$(gh run view "$RUN_ID" -R "$REPO" --json status,conclusion --jq '.status + "|" + (.conclusion // "")')
            STATUS="${OUT%%|*}"; CONCL="${OUT##*|}"
            [ "$STATUS" = "completed" ] && break
            echo "poll $i: publish run $STATUS"
            sleep 15
          done
          if [ "$CONCL" != "success" ]; then
            echo "::error::publish run concluded '${CONCL:-timeout}'"
            echo "Publish run https://github.com/$REPO/actions/runs/$RUN_ID concluded '${CONCL:-timeout}' - release incomplete." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Assert npm serves the new version
        if: steps.dispatch.outputs.run_id
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          NAME=$(node -p "require('./package.json').name")
          SERVED=""
          for i in $(seq 1 20); do
            SERVED=$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)
            [ "$SERVED" = "$VERSION" ] && break
            echo "poll $i: npm not serving ${NAME}@${VERSION} yet"
            sleep 15
          done
          if [ "$SERVED" != "$VERSION" ]; then
            echo "::error::npm does not serve ${NAME}@${VERSION}"
            echo "npm never served ${NAME}@${VERSION} - release incomplete." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Released ${NAME}@${VERSION} to npm." >> "$GITHUB_STEP_SUMMARY"
